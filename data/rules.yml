# ---- "Clear conversation" button (see actions/fallback.py) ------------------
# Shown after 3 consecutive off-topic messages. No `condition:` on this
# one deliberately — it should work the same whether or not a form is
# active (Restarted() wipes the tracker either way).
- rule: Handle the Clear conversation button
  steps:
    - intent: clear_conversation
    - action: action_clear_conversation

# NOTE: there is deliberately NO rule here for the typo-correction "Yes"
# button (/affirm_city_suggestion). An earlier version tried routing it
# through a dedicated rule + action, and it turned out unreliable: the
# affected slot's own from_text mapping (scoped to active_loop +
# requested_slot, not to any specific intent) grabs the raw payload text
# automatically as part of Core's normal per-turn slot filling, before
# any rule's prediction is acted on — so validate_<slot> would see the
# literal string "/affirm_city_suggestion" as the candidate regardless
# of what a rule said should happen next. Confirmed via a real,
# reproduced bug, not theory. The fix lives entirely inside
# actions.py's _match_city_or_ask, which recognises that literal string
# directly and resolves it from the pending_city_suggestion slot — the
# ordinary "form still active, fill+validate this slot" path (already
# covered by each form's own "Submit ... form" rule above) is all that's
# needed; no separate rule for this intent is required or used.