# ---- general task-switch (see actions.py's ActionHandleTaskSwitch) ----------
# User's own spec (chosen via AskUserQuestion, the BROADEST option:
# "گسترده‌تر: تعویض کامل کار وسط هر فرمی" — a general feature letting the
# user drop ANY currently-active form and jump to ANY of the 6 top-level
# tasks at any point). One rule per (active form, foreign entry intent)
# pair — 5 forms × 5 foreign intents each, plus book_confirmation_form
# (which has no "own" entry intent of its own, since it's only ever
# reached via a FollowupAction, never directly by the user) × all 6 = 31
# rules total.
#
# Same condition-scoped-rule-is-more-specific-than-unconditioned-rule
# pattern already proven by the "Route ... entry point" rules above
# coexisting with these (RulePolicy picks whichever rule's `condition:`
# actually matches the current active_loop — confirmed via real training,
# same mechanism this file already relies on for the off-topic/low-
# confidence rule pairs below).
#
# No `action: <form>` / `active_loop: <form>` tail needed on any of these
# (unlike "Handle destination change during trip planning" above) — see
# ActionHandleTaskSwitch's own docstring in actions.py for why: it always
# activates a genuinely DIFFERENT loop than the one it just exited, which
# rasa's own change_loop_to() constructs fresh with rejected=False, so
# there's no stuck-rejection flag to clear here the way there is for
# re-entering the SAME loop.
