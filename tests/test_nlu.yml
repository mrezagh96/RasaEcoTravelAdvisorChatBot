version: "3.1"

# =============================================================================
# tests/test_nlu.yml — HELD-OUT NLU test set (assignment Section 5,
# "Rasa NLU Testing")
# =============================================================================
# Every example below is a FRESH paraphrase written specifically for this
# file — different wording, different cities/currencies/numbers than any
# example in data/nlu.yml — never copy-pasted from the training data.
# tests/test_nlu_no_overlap.py enforces this mechanically on every test run:
# it fails the build if a single example here is an exact (normalised)
# duplicate of anything in data/nlu.yml, so this file cannot silently drift
# back into overlapping with training data later.
#
# Run against the trained model with:
#   .venv/bin/rasa test nlu -u tests/test_nlu.yml -m models/eco-travel-advisor.tar.gz --out results/nlu_held_out
#
# This is deliberately SEPARATE from the assignment's other prescribed
# method, `rasa test nlu --cross-validation --folds 5` (run directly on
# data/nlu.yml — see README "Testing" section) — cross-validation measures
# how well the model generalises WITHIN the training distribution by
# construction (it never trains and tests on the same fold), while this
# file measures generalisation to genuinely unseen phrasing/cities chosen
# by a human, which is the complementary, stronger check.
# =============================================================================

nlu:

- intent: greet
  examples: |
    - good day
    - hiya there
    - morning!
    - can you help me out?
    - hello, is anyone there?
    - hey, how's it going

- intent: goodbye
  examples: |
    - gotta go, bye for now
    - that's everything, cheers
    - I'll head off now
    - thanks, that's all I needed
    - speak soon

- intent: affirm
  examples: |
    - yup
    - definitely
    - that works for me
    - absolutely
    - fine by me
    - alright, let's do it

- intent: affirm_city_suggestion
  examples: |
    - yep that's the spelling I meant
    - correct, use that one
    - that's exactly the city I meant
    - yes, go with that spelling

- intent: clear_conversation
  examples: |
    - please reset everything
    - wipe the chat and start again
    - can we start from scratch
    - restart this conversation

- intent: deny
  examples: |
    - nah
    - not quite
    - that's wrong
    - no, don't do that
    - negative

- intent: thank_you
  examples: |
    - much appreciated
    - thanks so much
    - that was really helpful, thanks
    - cheers for that

- intent: bot_challenge
  examples: |
    - are you human or a machine?
    - am I chatting with software?
    - what exactly are you?
    - are you an assistant or a person?
    - what's your purpose here?
    - what kind of help can you offer?
    - describe what you do

