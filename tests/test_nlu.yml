    - [Wellington](origin_city) over to [Accra](destination_city)
    - I need an eco-conscious journey to [Casablanca](destination_city) leaving from [Tunis](origin_city)
    - let's organise a getaway to [Amman](destination_city)
    - I'm thinking about visiting [Beirut](destination_city)
    - could you plan something for me
    - i would love to travel somewhere green
